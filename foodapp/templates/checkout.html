<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-5">
        Checkout
    </h1>

    <div class="row">

        <div class="col-md-6">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label>Name</label>

                    <input type="text"
                           name="customer_name"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label>Phone</label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label>Address</label>

                    <textarea name="address"
                              class="form-control"
                              required>
                    </textarea>

                </div>
                <div class="mb-3">

                    <label class="form-label">

                      Select Payment Method

                    </label>

                    <select name="payment_method"
                            class="form-control"
                            required>

                        <option value="COD">

                         Cash On Delivery

                        </option>

                        <option value="ONLINE">

                          Pay Online

                        </option>

                    </select>

                </div>
                <button type="submit"
                        class="btn btn-success">

                    Place Order

                </button>

            </form>

        </div>

        <div class="col-md-6">

            <h3>Your Order</h3>

            <table class="table table-bordered">

                <tr>

                    <th>Food</th>
                    <th>Qty</th>
                    <th>Total</th>

                </tr>

                {% for item in cart_items %}

                <tr>

                    <td>{{ item.food.name }}</td>

                    <td>{{ item.quantity }}</td>

                    <td>₹ {{ item.total_price }}</td>

                </tr>

                {% endfor %}

            </table>

            <h4 class="text-end">

                Grand Total :
                ₹ {{ grand_total }}

            </h4>

        </div>

    </div>

</div>

</body>

</html>
