<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Login
                </h2>

                {% for message in messages %}

                    <div class="alert alert-danger">

                        {{ message }}

                    </div>

                {% endfor %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Username"
                               required>

                    </div>

                    <div class="mb-3">

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Password"
                               required>

                    </div>

                    <button class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <br>

                <a href="{% url 'register' %}">
                    Create New Account
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
